name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pages in step, links, weight
        run: python3 .github/scripts/check_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: No sideways scroll, every picture loads
        run: node .github/scripts/check_layout.js
